apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: model-serve-amd-chat
  namespace: model-serve-amd
spec:
  serviceName: model-serve-amd-chat
  replicas: 1
  selector:
    matchLabels:
      app: model-serve-amd-chat
  template:
    metadata:
      labels:
        app: model-serve-amd-chat
    spec:
      tolerations:
        - key: amd.com/gpu
          value: 'True'
          effect: "NoSchedule"
      serviceAccountName: deployer
      containers:
        - name: vllm-model-serve-amd-chat
          #image: rocm/vllm:rocm7.0.0_vllm_0.11.1_20251103
          image: rocm/vllm:v0.14.0_amd_dev
          #image: vllm/vllm-openai-rocm:v0.14.0
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0,1"
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: HUGGINGFACE_HUB_CACHE
              value: "/platform_storage/HF_HOME"
            # Uncomment and adjust for your AMD GPU architecture:
            # MI300X: "9.4.2", MI250/MI210: "9.0.0", MI100: "9.0.8", RX 7900: "11.0.0"
            #- name: HSA_OVERRIDE_GFX_VERSION
            #  value: "9.0.0"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting model on AMD GPU (HIP:0)"
              vllm serve ibm-granite/granite-3.3-8b-instruct \
                --host 0.0.0.0 \
                --port 8102 \
                --tensor-parallel-size 1 

              wait
          ports:
            - name: port-model
              containerPort: 8102

          resources:
            limits:
              amd.com/gpu: "1"

          volumeMounts:
            - name: pvc-model-serve-amd-chat
              mountPath: /platform_storage
            - name: cache
              mountPath: /.cache
            - name: config-volume
              mountPath: /.config
            - name: triton-volume
              mountPath: /.triton
            - name: aiter-volume
              mountPath: /.aiter

      volumes:
        - name: cache
          emptyDir: {}
        - name: config-volume
          emptyDir: {}
        - name: triton-volume
          emptyDir: {}
        - name: aiter-volume
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pvc-model-serve-amd-chat
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ocs-storagecluster-ceph-rbd
        #storageClassName: gp3-csi
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: model-serve-amd-chat
  namespace: model-serve-amd
spec:
  type: ClusterIP
  selector:
    app: model-serve-amd-chat
  ports:
    - name: port-model
      port: 8102
      targetPort: port-model
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: model-serve-amd-chat-route
  namespace: model-serve-amd
spec:
  host: model-serve-amd-chat.impactsummit.nxtgen.cloud
  to:
    kind: Service
    name: model-serve-amd-chat
  port:
    targetPort: port-model
  tls:
    termination: edge
