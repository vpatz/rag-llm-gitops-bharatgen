apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: model-serve-rerank
  namespace: model-serve
spec:
  serviceName: model-serve-rerank
  replicas: 1
  selector:
    matchLabels:
      app: model-serve-rerank
  template:
    metadata:
      labels:
        app: model-serve-rerank
    spec:
      tolerations:
        - key: nvidia.com/gpu
          value: 'True'
          effect: "NoSchedule"
      serviceAccountName: deployer
      containers:
        - name: vllm-model-serve-rerank
          image: vllm/vllm-openai:v0.14.1
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: HUGGINGFACE_HUB_CACHE
              value: "/platform_storage/HF_HOME"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting rerank model on CUDA:0"
              vllm serve BAAI/bge-reranker-v2-m3 \
                --host 0.0.0.0 \
                --port 8104 
                
              wait
          ports:
            - name: port-rerank
              containerPort: 8104

          resources:
            limits:
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: pvc-model-serve-rerank
              mountPath: /platform_storage
            - name: cache
              mountPath: /.cache
            - name: config-volume
              mountPath: /.config
            - name: triton-volume
              mountPath: /.triton
      volumes:
        - name: cache
          emptyDir: {}
        - name: config-volume
          emptyDir: {}
        - name: triton-volume
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pvc-model-serve-rerank
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ocs-storagecluster-ceph-rbd
        #storageClassName: gp3-csi
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: model-serve-rerank
  namespace: model-serve
spec:
  type: ClusterIP
  selector:
    app: model-serve-rerank
  ports:
    - name: port-rerank
      port: 8104
      targetPort: port-rerank
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: model-serve-rerank-route
  namespace: model-serve
spec:
  host: model-serve-rerank.impactsummit.nxtgen.cloud
  to:
    kind: Service
    name: model-serve-rerank
  port:
    targetPort: port-rerank
  tls:
    termination: edge
