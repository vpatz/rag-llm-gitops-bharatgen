        #name: ibm-granite/granite-3.1-1b-a400m-instruct
        port: 8001
        gpuMemoryUtilization: 0.5
    resources:
      #requests:
        #cpu: 8
        #memory: 8Gi
        #nvidia.com/gpu: "1"
      limits:
        #cpu: 16
        #memory: 12Gi
        nvidia.com/gpu: 2

  common:
    volumeMounts:
      - name: rag-akm-storage-pvc-model-serve-chat
        mountPath: /platform_storage
      - name: cache
        mountPath: /.cache
      - name: config-volume
        mountPath: /.config
      - name: triton-volume
        mountPath: /.triton


