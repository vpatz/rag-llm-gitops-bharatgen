namespace: indic-rag2

#imagePullSecrets:
  #- cil15-vela-all-icr-io

serviceAccountName: deployer

pvc:
  name: rag-akm-storage-pvc
  modelStorageName: rag-akm-storage-pvc-model-serve
  modelChatStorageName: rag-akm-storage-pvc-model-serve-chat
  modelVisionStorageName: rag-akm-storage-pvc-model-serve-vision

commonVolumeMount:
  volumeMounts:
    - name: rag-akm-storage-pvc
      mountPath: /platform_storage


#nodeSelector:
  #gpu: "true"
  #gpu: "false"

routes:
  domain: impactsummit.nxtgen.cloud
  #domain: indic-rag.vpc.res.ibm.com

# -------------------------------------------------
# Flux-Backend for RAG
# -------------------------------------------------
ragBackend:
  image: arnab135/rag-app:latest
  port: 15000
  resources:
    requests:
      cpu: 12
      memory: 8Gi
    limits:
      cpu: 24
      memory: 16Gi
      nvidia.com/gpu: 0

# -------------------------------------------------
# DB Utility Gradio Service
# -------------------------------------------------
dbUI:
  image: arnab135/rag-app:latest
  port: 10000
  resources:
    requests:
      cpu: 12
      memory: 4Gi
      ephemeral-storage: "1Gi"
    limits:
      cpu: 24
      memory: 8Gi
      ephemeral-storage: "2Gi"
      nvidia.com/gpu: 0

# -------------------------------------------------
# RAG UI Gradio Service
# -------------------------------------------------
ragUI:
  image: arnab135/rag-app:latest
  port: 11000
  resources:
    requests:
      cpu: 12
      memory: 8Gi
    limits:
      cpu: 24
      memory: 16Gi
      nvidia.com/gpu: 0

# -------------------------------------------------
# Milvus-DB Server
# -------------------------------------------------
milvus:
  image: milvusdb/milvus:v2.6.7
  etcdImage: bitnamilegacy/etcd:3.6.4-debian-12-r4
  minioImage: minio/minio:latest

  etcd:
    resources:
      requests:
        cpu: 6 
        memory: 8Gi
      limits:
        cpu: 12 
        memory: 16Gi

  minio:
    accessKey: minioadmin
    secretKey: minioadmin
    resources:
      requests:
        cpu: 6
        memory: 512Mi
      limits:
        cpu: 12
        memory: 1Gi

  milvus:
    resources:
      requests:
        cpu: 6
        memory: 8Gi
      limits:
        cpu: 12
        memory: 16Gi

# -------------------------------------------------
# Model Serving -- text embedding and reranker
# -------------------------------------------------
modelServe:
  image: vllm/vllm-openai:latest
  #nodeSelector:
    #gpu: "true"
    #nvidia.com/gpu: "true"
  resources:
    requests:
      nvidia.com/gpu: 1
      cpu: 10
      memory: 32Gi
    limits:
      nvidia.com/gpu: 1
      cpu: 12
      memory: 64Gi
  
  service:
    name: model-serve-svc
    type: ClusterIP
    ports:
      embed:
        port: 8002
        targetPort: embed
      rerank:
        port: 8003
        targetPort: rerank

  routes:
    enabled: true
    embed:
      host: embed-route.impactsummit.nxtgen.cloud
      #host: embed-route.indic-rag.vpc.res.ibm.com
      servicePort: embed
    rerank:
      host: rerank-route.impactsummit.nxtgen.cloud
      #host: rerank-route.indic-rag.vpc.res.ibm.com
      servicePort: rerank

  textGpu:
    cudaVisibleDevices: "0,1"
    models:
      embed:
        name: intfloat/multilingual-e5-large
        #name: intfloat/multilingual-e5-small
        port: 8002
        gpuMemoryUtilization: 0.4
      rerank:
        name: BAAI/bge-reranker-v2-m3
        port: 8003
        gpuMemoryUtilization: 0.4
    resources:
      #requests:
        #cpu: 8
        #memory: 8Gi
        #nvidia.com/gpu: "1"
      limits:
        #cpu: 16
        #memory: 12Gi
        nvidia.com/gpu: 2

  common:
    volumeMounts:
      - name: rag-akm-storage-pvc-model-serve
        mountPath: /platform_storage
      - name: cache
        mountPath: /.cache
      - name: config-volume
        mountPath: /.config
      - name: triton-volume
        mountPath: /.triton


# -------------------------------------------------
# Model Serving -- text chat
# -------------------------------------------------
modelServeChat:
  image: vllm/vllm-openai:latest
  #nodeSelector:
    #gpu: "true"
    #nvidia.com/gpu: "true"
