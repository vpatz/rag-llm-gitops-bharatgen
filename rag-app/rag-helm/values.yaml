namespace: indic-rag

#imagePullSecrets:
  #- cil15-vela-all-icr-io

serviceAccountName: deployer

pvc:
  name: rag-akm-storage-pvc
  modelStorageName: rag-akm-storage-pvc-model-serve

commonVolumeMount:
  volumeMounts:
    - name: rag-akm-storage-pvc
      mountPath: /platform_storage


#nodeSelector:
  #gpu: "true"
  #gpu: "false"

routes:
  domain: indic-rag.vpc.res.ibm.com

# -------------------------------------------------
# Flux-Backend for RAG
# -------------------------------------------------
ragBackend:
  image: arnab135/rag-app:latest
  port: 15000
  resources:
    requests:
      cpu: 0.1
      memory: 2Gi
    limits:
      cpu: 1
      memory: 4Gi

# -------------------------------------------------
# DB Utility Gradio Service
# -------------------------------------------------
dbUI:
  image: arnab135/rag-app:latest
  port: 10000
  resources:
    requests:
      cpu: 0.1
      memory: 2Gi
      ephemeral-storage: "1Gi"
    limits:
      cpu: 2
      memory: 4Gi
      ephemeral-storage: "2Gi"

# -------------------------------------------------
# RAG UI Gradio Service
# -------------------------------------------------
ragUI:
  image: arnab135/rag-app:latest
  port: 11000
  resources:
    requests:
      cpu: 0.1
      memory: 2Gi
    limits:
      cpu: 1
      memory: 4Gi

# -------------------------------------------------
# Milvus-DB Server
# -------------------------------------------------
milvus:
  image: milvusdb/milvus:v2.6.7
  etcdImage: bitnamilegacy/etcd:3.6.4-debian-12-r4
  minioImage: minio/minio:latest

  etcd:
    resources:
      requests:
        cpu: 0.1 
        memory: 2Gi
      limits:
        cpu: 1 
        memory: 4Gi

  minio:
    accessKey: minioadmin
    secretKey: minioadmin
    resources:
      requests:
        cpu: 0.1
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi

  milvus:
    resources:
      requests:
        cpu: 0.1
        memory: 8Gi
      limits:
        cpu: 1
        memory: 16Gi

# -------------------------------------------------
# Model Serving
# -------------------------------------------------
modelServe:
  image: vllm/vllm-openai:latest
  #nodeSelector:
    #gpu: "true"
    #nvidia.com/gpu: "true"
  resources:
    requests:
      nvidia.com/gpu: 1
      cpu: 1
      memory: 16Gi
    limits:
      nvidia.com/gpu: 1
      cpu: 8
      memory: 32Gi
  
  service:
    name: model-serve-svc
    type: ClusterIP
    ports:
      chat:
        port: 8001
        targetPort: chat
      embed:
        port: 8002
        targetPort: embed
      rerank:
        port: 8003
        targetPort: rerank
      vision:
        port: 8004
        targetPort: vision

  routes:
    enabled: true
    chat:
      host: chat-route.indic-rag.vpc.res.ibm.com
      servicePort: chat
    embed:
      host: embed-route.indic-rag.vpc.res.ibm.com
      servicePort: embed
    rerank:
      host: rerank-route.indic-rag.vpc.res.ibm.com
      servicePort: rerank
    vision:
      host: vision-route.indic-rag.vpc.res.ibm.com
      servicePort: vision

  textGpu:
    cudaVisibleDevices: "0"
    models:
      chat:
        name: ibm-granite/granite-3.3-8b-instruct
        port: 8001
        gpuMemoryUtilization: 0.7
      embed:
        name: intfloat/multilingual-e5-large
        port: 8002
        gpuMemoryUtilization: 0.1
      rerank:
        name: BAAI/bge-reranker-v2-m3
        port: 8003
        gpuMemoryUtilization: 0.1
    #resources:
      #requests:
        #cpu: 8
        #memory: 8Gi
        #nvidia.com/gpu: "1"
      #limits:
        #cpu: 16
        #memory: 12Gi
        #nvidia.com/gpu: "1"

  visionGpu:
    cudaVisibleDevices: "0"
    model:
      name: mistralai/Pixtral-12B-2409
      #name: RedHatAI/pixtral-12b-quantized.w4a16
      port: 8004
      tokenizerMode: mistral
    #resources:
      #requests:
        #cpu: 2
        #memory: 8Gi
        #nvidia.com/gpu: "1"
      #limits:
        #cpu: 4
        #memory: 12Gi
        #nvidia.com/gpu: "1"

  common:
    volumeMounts:
      - name: rag-akm-storage-pvc-model-serve
        mountPath: /platform_storage
      - name: cache
        mountPath: /.cache
      - name: config-volume
        mountPath: /.config
      - name: triton-volume
        mountPath: /.triton

# -------------------------------------------------
# Docling Server
# -------------------------------------------------
docling:
  replicas: 1

  image: quay.io/docling-project/docling-serve:latest
  #imagePullPolicy: IfNotPresent
  imagePullPolicy: Always 

  port: 5001

  workers: 4

  env:
    #cudaVisibleDevices: ""
    numThreads: "4"

  cacheMountPath: /tmp/docling

  resources:
    requests:
      cpu: 0.5
      memory: "8Gi"
      ephemeral-storage: "1Gi"
    limits:
      cpu: 1
      memory: "16Gi"
      ephemeral-storage: "2Gi"