apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serve
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-serve
  template:
    metadata:
      labels:
        app: model-serve
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:

        # ============================
        # CUDA:0 — Text models
        # ============================
        - name: vllm-text
          image: {{ .Values.modelServe.image }}
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "{{ .Values.modelServe.textGpu.cudaVisibleDevices }}"
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: HUGGINGFACE_HUB_CACHE
              value: "/platform_storage/HF_HOME"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting text models on CUDA:{{ .Values.modelServe.textGpu.cudaVisibleDevices }}"
              vllm serve {{ .Values.modelServe.textGpu.models.chat.name }} \
                --host 0.0.0.0 \
                --port {{ .Values.modelServe.textGpu.models.chat.port }} \
                --gpu-memory-utilization {{ .Values.modelServe.textGpu.models.chat.gpuMemoryUtilization }} &

              vllm serve {{ .Values.modelServe.textGpu.models.embed.name }} \
                --host 0.0.0.0 \
                --port {{ .Values.modelServe.textGpu.models.embed.port }} \
                --gpu-memory-utilization {{ .Values.modelServe.textGpu.models.embed.gpuMemoryUtilization }} &

              vllm serve {{ .Values.modelServe.textGpu.models.rerank.name }} \
                --host 0.0.0.0 \
                --port {{ .Values.modelServe.textGpu.models.rerank.port }} \
                --gpu-memory-utilization {{ .Values.modelServe.textGpu.models.rerank.gpuMemoryUtilization }} &

              wait
          ports:
            - name: chat
              containerPort: {{ .Values.modelServe.textGpu.models.chat.port }}
            - name: embed
              containerPort: {{ .Values.modelServe.textGpu.models.embed.port }}
            - name: rerank
              containerPort: {{ .Values.modelServe.textGpu.models.rerank.port }}
          resources:
{{ toYaml .Values.modelServe.textGpu.resources | indent 12 }}
          volumeMounts:
{{ toYaml $.Values.modelServe.common.volumeMounts | indent 12 }}

        # ============================
        # CUDA:1 — Vision model
        # ============================
        - name: vllm-vision
          image: {{ .Values.modelServe.image }}
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "{{ .Values.modelServe.visionGpu.cudaVisibleDevices }}"
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: HUGGINGFACE_HUB_CACHE
              value: "/platform_storage/HF_HOME"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting vision model on CUDA:{{ .Values.modelServe.visionGpu.cudaVisibleDevices }}"
              vllm serve {{ .Values.modelServe.visionGpu.model.name }} \
                --host 0.0.0.0 \
                --port {{ .Values.modelServe.visionGpu.model.port }} \
                --tokenizer_mode {{ .Values.modelServe.visionGpu.model.tokenizerMode }}
          ports:
            - name: vision
              containerPort: {{ .Values.modelServe.visionGpu.model.port }}
          resources:
{{ toYaml .Values.modelServe.visionGpu.resources | indent 12 }}
          volumeMounts:
{{ toYaml $.Values.modelServe.common.volumeMounts | indent 12 }}

      volumes:
        - name: rag-akm-storage-pvc
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
        - name: cache
          emptyDir: {}
        - name: config-volume
          emptyDir: {}
        - name: triton-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.modelServe.service.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.modelServe.service.type }}
  selector:
    app: model-serve
  ports:
    {{- range $name, $cfg := .Values.modelServe.service.ports }}
    - name: {{ $name }}
      port: {{ $cfg.port }}
      targetPort: {{ $cfg.targetPort }}
    {{- end }}
{{- if .Values.modelServe.routes.enabled }}
{{- range $name, $route := .Values.modelServe.routes }}
{{- if ne $name "enabled" }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}-route
  namespace: {{ $.Values.namespace }}
spec:
  host: {{ $route.host }}
  to:
    kind: Service
    name: {{ $.Values.modelServe.service.name }}
  port:
    targetPort: {{ $route.servicePort }}
  tls:
    termination: edge
{{- end }}
{{- end }}
{{- end }}
