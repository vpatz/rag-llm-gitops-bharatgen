apiVersion: apps/v1
#kind: Deployment
kind: StatefulSet
metadata:
  name: model-serve-scale
  #namespace: vllm-scale
  namespace: vllm-scale
spec:
  serviceName: model-serve-scale
  replicas: 1
  selector:
    matchLabels:
      app: model-serve-scale
  template:
    metadata:
      labels:
        app: model-serve-scale
    spec:
      tolerations:
        - key: nvidia.com/gpu
          value: 'True'
          effect: "NoSchedule"
      serviceAccountName: deployer
      containers:
        - name: vllm-model-serve-scale
          image: vllm/vllm-openai:v0.14.1
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0,1,2,3"
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: HUGGINGFACE_HUB_CACHE
              value: "/platform_storage/HF_HOME"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting granite-3.3-2b-instruct model on CUDA:0"
              vllm serve ibm-granite/granite-3.3-2b-instruct \
                --host 0.0.0.0 \
                --port 8101 \
                --dtype bfloat16 \
                --trust-remote-code \
                --tensor-parallel-size 4 

              wait
          ports:
            - name: port-model
              containerPort: 8101

          resources:
            limits:
              nvidia.com/gpu: "4"

          volumeMounts:
            - name: pvc-model-serve-scale
              mountPath: /platform_storage
            - name: cache
              mountPath: /.cache
            - name: config-volume
              mountPath: /.config
            - name: triton-volume
              mountPath: /.triton
      volumes:
        - name: cache
          emptyDir: {}
        - name: config-volume
          emptyDir: {}
        - name: triton-volume
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pvc-model-serve-scale
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ocs-storagecluster-ceph-rbd
        #storageClassName: gp3-csi
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: model-serve-scale
  namespace: vllm-scale
spec:
  type: ClusterIP
  selector:
    app: model-serve-scale
  ports:
    - name: port-model
      port: 8101
      targetPort: port-model
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: model-serve-scale-route
  namespace: vllm-scale
spec:
  host: model-serve-scale-route.impactsummit.nxtgen.cloud
  to:
    kind: Service
    name: model-serve-scale
  port:
    targetPort: port-model
  tls:
    termination: edge


